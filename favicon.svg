<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="crownGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle with subtle glow -->
  <circle cx="16" cy="16" r="15" fill="url(#backgroundGradient)" stroke="url(#crownGradient)" stroke-width="0.8"/>
  
  <!-- Crown Base -->
  <rect x="9" y="21" width="14" height="2.5" fill="url(#crownGradient)" rx="1.2"/>
  
  <!-- Crown Main Structure -->
  <polygon points="16,7 11,18 13,18 16,10 19,18 21,18" fill="url(#crownGradient)" filter="url(#glow)"/>
  
  <!-- Crown Center Jewel -->
  <circle cx="16" cy="11" r="1.8" fill="#1a1a2e"/>
  <circle cx="16" cy="11" r="1.3" fill="url(#crownGradient)"/>
  
  <!-- Side Jewels -->
  <circle cx="12" cy="13" r="0.8" fill="#1a1a2e"/>
  <circle cx="12" cy="13" r="0.5" fill="url(#crownGradient)"/>
  
  <circle cx="20" cy="13" r="0.8" fill="#1a1a2e"/>
  <circle cx="20" cy="13" r="0.5" fill="url(#crownGradient)"/>
  
  <!-- CS Text with better positioning -->
  <text x="16" y="27" font-family="Arial, sans-serif" font-size="5" font-weight="bold" text-anchor="middle" fill="url(#crownGradient)">CS</text>
  
  <!-- Subtle shine effect -->
  <ellipse cx="12" cy="8" rx="2" ry="1" fill="rgba(255,255,255,0.2)" transform="rotate(-30 12 8)"/>
</svg>
