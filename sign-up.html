<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Crown Phone</title>
    <link rel="icon" type="image/png" href="fevp.png">
    <link rel="icon" type="image/png" href="fevp.png">
    <link rel="apple-touch-icon" href="fevp.png">
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./scripts/supabase.js"></script>
    <style>
        /* Additional styles specific to sign up page */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 0, 0, 0.15), rgba(139, 0, 0, 0.15));
            z-index: -1;
            transform: translateY(-50%) rotate(-10deg) scale(1.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-title {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #ff0000, #8B0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        .auth-subtitle {
            color: #ccc;
            font-size: 1rem;
            font-weight: 400;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-group {
            position: relative;
            flex: 1;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: rgba(255, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-label {
            position: absolute;
            top: -10px;
            left: 15px;
            background: linear-gradient(45deg, #ff0000, #8B0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0 5px;
        }

        .form-label::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
           
            z-index: -1;
            transform: translateY(-50%);
        }

        .form-options {
            display: flex;
            align-items: center;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #ccc;
        }

        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .auth-btn {
            padding: 1rem;
            background: linear-gradient(45deg, #ff0000, #8B0000);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.4);
            background: linear-gradient(45deg, #dc3545, #c82333);
        }

        .auth-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .auth-btn:hover::after {
            transform: translateX(100%);
        }



        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            color: #ccc;
            font-size: 0.9rem;
        }
        
        .auth-footer-links {
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .auth-footer-link {
            color: #ff0000;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }
        
        .auth-footer-link:hover {
            color: #8B0000;
        }

        .auth-link {
            background: linear-gradient(45deg, #ff0000, #8B0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .auth-link:hover {
            background: linear-gradient(45deg, #dc3545, #c82333);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .password-strength {
            height: 5px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .strength-meter {
            height: 100%;
            width: 0;
            transition: width 0.3s ease, background 0.3s ease;
        }

        .strength-weak {
            width: 33.33%;
            background: #ff4757;
        }

        .strength-medium {
            width: 66.66%;
            background: #ffa502;
        }

        .strength-strong {
            width: 100%;
            background: #2ed573;
        }

        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Red Background Elements */
        .background-dots {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ff0000;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        .dot:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .dot:nth-child(2) { top: 20%; left: 20%; animation-delay: 0.5s; }
        .dot:nth-child(3) { top: 30%; left: 15%; animation-delay: 1s; }
        .dot:nth-child(4) { top: 40%; left: 25%; animation-delay: 1.5s; }
        .dot:nth-child(5) { top: 50%; left: 10%; animation-delay: 2s; }
        .dot:nth-child(6) { top: 60%; left: 20%; animation-delay: 2.5s; }
        .dot:nth-child(7) { top: 70%; left: 15%; animation-delay: 3s; }
        .dot:nth-child(8) { top: 80%; left: 25%; animation-delay: 3.5s; }
        .dot:nth-child(9) { top: 15%; left: 80%; animation-delay: 0.2s; }
        .dot:nth-child(10) { top: 25%; left: 85%; animation-delay: 0.7s; }
        .dot:nth-child(11) { top: 35%; left: 75%; animation-delay: 1.2s; }
        .dot:nth-child(12) { top: 45%; left: 90%; animation-delay: 1.7s; }
        .dot:nth-child(13) { top: 55%; left: 80%; animation-delay: 2.2s; }
        .dot:nth-child(14) { top: 65%; left: 85%; animation-delay: 2.7s; }
        .dot:nth-child(15) { top: 75%; left: 75%; animation-delay: 3.2s; }
        .dot:nth-child(16) { top: 85%; left: 90%; animation-delay: 3.7s; }
        .dot:nth-child(17) { top: 12%; left: 50%; animation-delay: 0.3s; }
        .dot:nth-child(18) { top: 22%; left: 60%; animation-delay: 0.8s; }
        .dot:nth-child(19) { top: 32%; left: 40%; animation-delay: 1.3s; }
        .dot:nth-child(20) { top: 42%; left: 70%; animation-delay: 1.8s; }

        .background-stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star-bg {
            position: absolute;
            color: #ff0000;
            font-size: 20px;
            animation: twinkle 4s infinite ease-in-out;
        }

        .star-bg:nth-child(1) { top: 5%; left: 5%; animation-delay: 0s; }
        .star-bg:nth-child(2) { top: 15%; left: 15%; animation-delay: 0.8s; }
        .star-bg:nth-child(3) { top: 25%; left: 8%; animation-delay: 1.6s; }
        .star-bg:nth-child(4) { top: 35%; left: 18%; animation-delay: 2.4s; }
        .star-bg:nth-child(5) { top: 45%; left: 5%; animation-delay: 3.2s; }
        .star-bg:nth-child(6) { top: 55%; left: 15%; animation-delay: 0.4s; }
        .star-bg:nth-child(7) { top: 65%; left: 8%; animation-delay: 1.2s; }
        .star-bg:nth-child(8) { top: 75%; left: 18%; animation-delay: 2.0s; }
        .star-bg:nth-child(9) { top: 85%; left: 5%; animation-delay: 2.8s; }
        .star-bg:nth-child(10) { top: 10%; left: 85%; animation-delay: 0.6s; }
        .star-bg:nth-child(11) { top: 20%; left: 90%; animation-delay: 1.4s; }
        .star-bg:nth-child(12) { top: 30%; left: 80%; animation-delay: 2.2s; }
        .star-bg:nth-child(13) { top: 40%; left: 95%; animation-delay: 3.0s; }
        .star-bg:nth-child(14) { top: 50%; left: 85%; animation-delay: 0.2s; }
        .star-bg:nth-child(15) { top: 60%; left: 90%; animation-delay: 1.0s; }
        .star-bg:nth-child(16) { top: 70%; left: 80%; animation-delay: 1.8s; }
        .star-bg:nth-child(17) { top: 80%; left: 95%; animation-delay: 2.6s; }
        .star-bg:nth-child(18) { top: 90%; left: 85%; animation-delay: 3.4s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .shape {
            position: absolute;
            background: linear-gradient(45deg, rgba(255, 0, 0, 0.1), rgba(139, 0, 0, 0.1));
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        .shape:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            right: -150px;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 200px;
            height: 200px;
            top: 50%;
            left: -100px;
            animation-delay: 3s;
        }

        .shape:nth-child(3) {
            width: 150px;
            height: 150px;
            bottom: -75px;
            right: 20%;
            animation-delay: 6s;
        }

        .shape:nth-child(4) {
            width: 80px;
            height: 80px;
            top: 30%;
            right: 10%;
            animation-delay: 9s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        .back-to-home {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .back-to-home:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .auth-card {
                padding: 2rem 1.5rem;
            }

            .auth-title {
                font-size: 1.8rem;
            }

            .back-to-home {
                top: 1rem;
                left: 1rem;
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }

            .form-row {
                flex-direction: column;
                gap: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 1.5rem 1rem;
            }

            .auth-title {
                font-size: 1.5rem;
            }

            .form-options {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }


        }
    </style>
</head>

    <div class="auth-container">
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>

        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join Crown Screens and unlock premium features</p>
            </div>

            <form class="auth-form" id="signup-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name" class="form-label">First Name</label>
                        <input type="text" id="first-name" class="form-input" placeholder="First name" required>
                    </div>
                    <div class="form-group">
                        <label for="last-name" class="form-label">Last Name</label>
                        <input type="text" id="last-name" class="form-input" placeholder="Last name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Create a strong password" required>
                    <div class="password-strength">
                        <div class="strength-meter" id="strength-meter"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password" class="form-label">Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-input" placeholder="Confirm your password" required>
                </div>

                <div class="form-options">
                    <div class="form-checkbox">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a href="#" class="auth-link">Terms of Service</a> and <a href="#" class="auth-link">Privacy Policy</a></label>
                    </div>
                </div>

                <button type="submit" class="auth-btn">Create Account</button>
            </form>



            <div class="auth-footer">
                <p>Already have an account? <a href="sign-in.html" class="auth-link">Sign In</a></p>
                <div class="auth-footer-links">
                    <a href="index.html#features" class="auth-footer-link">Features</a>
                    <a href="index.html#pricing" class="auth-footer-link">Pricing</a>
                    <a href="index.html#contact" class="auth-footer-link">Contact</a>
                    <a href="index.html#download" class="auth-footer-link">Download</a>
                    <a href="privacy-policy.html" class="auth-footer-link">Privacy Policy</a>
                    <a href="terms-of-service.html" class="auth-footer-link">Terms of Service</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Password strength meter
            const passwordInput = document.getElementById('password');
            const strengthMeter = document.getElementById('strength-meter');
            const confirmPassword = document.getElementById('confirm-password');
            
            // Create error message element
            const errorMessage = document.createElement('div');
            errorMessage.className = 'auth-error';
            errorMessage.style.display = 'none';
            errorMessage.style.color = '#ff4757';
            errorMessage.style.marginTop = '10px';
            errorMessage.style.textAlign = 'center';
            const signupForm = document.getElementById('signup-form');
            signupForm.appendChild(errorMessage);
            
            passwordInput.addEventListener('input', function() {
                const password = this.value;
                let strength = 0;
                
                // Check length
                if (password.length >= 8) {
                    strength += 1;
                }
                
                // Check for mixed case
                if (password.match(/[a-z]/) && password.match(/[A-Z]/)) {
                    strength += 1;
                }
                
                // Check for numbers
                if (password.match(/\d/)) {
                    strength += 1;
                }
                
                // Check for special characters
                if (password.match(/[^a-zA-Z\d]/)) {
                    strength += 1;
                }
                
                // Update strength meter
                strengthMeter.className = 'strength-meter';
                
                if (password.length === 0) {
                    strengthMeter.style.width = '0';
                } else if (strength < 2) {
                    strengthMeter.classList.add('strength-weak');
                } else if (strength < 4) {
                    strengthMeter.classList.add('strength-medium');
                } else {
                    strengthMeter.classList.add('strength-strong');
                }
            });
            
            // Form submission
            signupForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const firstName = document.getElementById('first-name').value;
                const lastName = document.getElementById('last-name').value;
                const email = document.getElementById('email').value;
                const password = passwordInput.value;
                const confirmPwd = confirmPassword.value;
                
                // Check if passwords match
                if (password !== confirmPwd) {
                    errorMessage.textContent = 'Passwords do not match!';
                    errorMessage.style.display = 'block';
                    return;
                }
                
                // Show loading state
                const submitButton = this.querySelector('button[type="submit"]');
                const originalButtonText = submitButton.textContent;
                submitButton.textContent = 'Creating Account...';
                submitButton.disabled = true;
                errorMessage.style.display = 'none';
                
                try {
                    // Create user metadata
                    const userData = {
                        first_name: firstName,
                        last_name: lastName,
                        full_name: `${firstName} ${lastName}`
                    };
                    
                    // Sign up with Supabase
                    const { data, error } = await signUp(email, password, userData);
                    
                    if (error) {
                        throw error;
                    }
                    
                    if (data && data.user) {
                        // Check if email confirmation is required
                        if (data.session) {
                            // Auto sign-in (no email confirmation required)
                            window.location.href = 'index.html';
                        } else {
                            // Email confirmation required
                            alert('Registration successful! Please check your email to confirm your account.');
                            window.location.href = 'sign-in.html';
                        }
                    } else {
                        throw new Error('Sign up failed. Please try again.');
                    }
                } catch (error) {
                    // Show error message
                    errorMessage.textContent = error.message || 'Sign up failed. Please try again.';
                    errorMessage.style.display = 'block';
                    
                    // Reset button
                    submitButton.textContent = originalButtonText;
                    submitButton.disabled = false;
                }
            });
            

        });
    </script>
